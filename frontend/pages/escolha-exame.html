<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GuiaVest - Escolha de exames</title>
    <link rel="stylesheet" href="../src/css/base.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/escolha-exame.css">
</head>
<body>
    <header class="topo">
        <div class="logo">GuiaVest</div>
    </header>

    <main class="conteudo">
        <h1>Escolha qual exame você quer focar</h1>
        <p class="legenda">Seu cronograma será montado a partir do exame escolhido.</p>
        <div class="grade">
            <button type="button" data-exame="enem" class="button-exam enem" aria-pressed="false">Enem</button>
            <button type="button" data-exame="fuvest" class="button-exam fuvest" aria-pressed="false">Fuvest</button>
            <button type="button" data-exame="unicamp" class="button-exam unicamp" aria-pressed="false">Unicamp</button>
            <button type="button" data-exame="unesp" class="button-exam unesp" aria-pressed="false">UNESP</button>
            <button type="button" data-exame="outros" class="button-exam outros" aria-pressed="false">Outros exames</button>
        </div>
         <p id="mensagem-selecao" aria-live="polite"></p>
    </main>

    <script src="../src/js/escolha-exame.js"></script>
</body>
</html>
