<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GuiaVest - Cronograma</title>
    <link rel="stylesheet" href="../src/css/base.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/cronograma.css">
</head>
<body>
    <header class="topo">
        <div class="logo">GuiaVest</div>
        <nav class="menu" aria-label="Navegação principal">
            <button type="button" data-pagina="dashboard.html">Painel</button>
            <button type="button" data-pagina="cronograma.html" aria-current="page">Cronograma</button>
            <button type="button" data-pagina="lembretes.html">Lembretes</button>
        </nav>
    </header>

    <main class="conteudo cronograma">
        <div class="cronograma-cabecalho">
            <h1>Cronograma</h1>
            <button type="button" class="botao" data-pagina="dashboard.html">Ir para dashboard</button>
        </div>
        <section aria-labelledby="cronograma-periodo">
            <div class="cronograma-navegacao">
                <button type="button" class="botao" id="semana-anterior">← Anterior</button>

                <h2 id="cronograma-periodo" aria-live="polite"></h2>
                
                <button type="button" class="botao" id="semana-proxima">Próxima →</button>
            </div>
            <div class="cronograma-retorno">
                <p id="cronograma-mensagem" role="status"></p>

                <button type="button" class="botao" id="gerar-cronograma" hidden>Gerar cronograma</button>

                <button type="button" class="botao" id="recarregar-cronograma" hidden>Tentar novamente</button>
            </div>
            <div class="cronograma-semana" id="cronograma-semana" hidden></div>
        </section>
    </main>

    <dialog class="cronograma-edicao" id="dialogo-editar-tarefa">
        <form id="form-editar-tarefa" method="dialog">
            <h2>Editar tarefa</h2>
            <input type="hidden" id="editar-tarefa-id">

            <label for="editar-tarefa-data">Dia
                <input type="date" id="editar-tarefa-data" required>
            </label>

            <label for="editar-tarefa-turno">Turno
                <select id="editar-tarefa-turno" required>
                    <option value="MANHA">Manhã</option>
                    <option value="TARDE">Tarde</option>
                    <option value="NOITE">Noite</option>
                </select>
            </label>

            <label for="editar-tarefa-materia">Matéria
                <input type="text" id="editar-tarefa-materia" maxlength="100" required>
            </label>

            <label for="editar-tarefa-duracao">Duração (minutos)
                <input type="number" id="editar-tarefa-duracao" min="1" max="1440" required>
            </label>

            <label for="editar-tarefa-descricao">Descrição
                <textarea id="editar-tarefa-descricao" maxlength="500" rows="4"
                    placeholder="O que você precisa fazer nesta tarefa?"></textarea>
            </label>

            <label class="cronograma-edicao-status">
                <input type="checkbox" id="editar-tarefa-concluido">
                Tarefa concluída
            </label>

            <p id="editar-tarefa-mensagem" role="status"></p>

            <div class="cronograma-edicao-acoes">
                <button type="button" class="botao" id="cancelar-edicao-tarefa">Cancelar</button>
                <button type="submit" class="botao botao-primario">Salvar</button>
            </div>
        </form>
    </dialog>

    <script src="../src/js/navegacao.js"></script>
    <script src="../src/js/auth.js"></script>
    <script src="../src/js/cronograma.js"></script>
</body>
</html>
