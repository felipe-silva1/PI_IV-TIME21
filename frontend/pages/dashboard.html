<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GuiaVest - Dashboard</title>
    <link rel="stylesheet" href="../src/css/base.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/dashboard.css">
</head>
<body>
    <header class="topo">
        <div class="logo">GuiaVest</div>
        <nav class="menu" aria-label="Navegação principal">
            <button type="button" data-pagina="dashboard.html" aria-current="page">Painel</button>
            <button type="button" data-pagina="cronograma.html">Cronograma</button>
            <button type="button" data-pagina="lembretes.html">Lembretes</button>
        </nav>
    </header>
    <main class="conteudo">
        <div class="painel-cabecalho">
            <h1>Painel</h1>
            <button type="button" class="botao" data-pagina="rotina.html">
                Configurar / Editar rotina
            </button>
        </div>
        <section class="painel-progresso" id="progresso-painel" aria-labelledby="titulo-progresso">
            <div class="painel-progresso-topo">
                <h2 id="titulo-progresso">Progresso semanal <span id="progresso-periodo"></span></h2>
                <span id="progresso-percentual" class="painel-progresso-percentual">0%
                </span>
            </div>
            <p id="progresso-status" class="legenda" role="status"></p>
            <progress id="progresso-barra" class="painel-progresso-barra" value="0" max="100">0%</progress>
            <p id="progresso-tarefas" class="legenda"></p>
            <p id="progresso-horas" class="legenda"></p>
        </section>
        <div class="painel-estudos">
            <section class="painel-semana" aria-labelledby="titulo-semana">
                <h2 id="titulo-semana">Cronograma da semana</h2>
                <p id="semana-status" role="status"></p>

                <div class="painel-semana-rolagem" id="semana-rolagem"
                     role="region" aria-labelledby="titulo-semana"
                     tabindex="0" hidden>
                    <div class="painel-semana-dias" id="semana-dias"></div>
                </div>

                <div id="semana-legenda" hidden>
                    <p class="painel-semana-instrucao">Clique em um bloco para marcar ou desmarcar a conclusão.</p>
                    <ul class="painel-semana-legenda">
                        <li><span class="painel-semana-marca concluido"></span> Concluído</li>
                        <li><span class="painel-semana-marca atrasado"></span> Atrasado</li>
                        <li><span class="painel-semana-marca pendente"></span> Pendente</li>
                    </ul>
                </div>

                <p class="painel-proximo-estudo" id="proximo-estudo" hidden>
                    <strong>Próximo estudo</strong>
                    <span id="proximo-estudo-detalhes"></span>
                </p>

                <button type="button" class="botao" data-pagina="cronograma.html">   
                    Ver cronograma completo
                </button>
            </section>

            <section class="painel-tarefas" aria-labelledby="titulo-tarefas">
                <h2 id="titulo-tarefas">Tarefas de hoje</h2>
                <p id="tarefas-status" class="legenda" role="status"></p>
                <ul id="tarefas-lista" class="painel-tarefas-lista"></ul>
            </section>
        </div>
    </main>

    <script src="../src/js/navegacao.js"></script>
    <script src="../src/js/auth.js"></script>
    <script src="../src/js/dashboard.js"></script>
</body>
</html>
