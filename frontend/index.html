<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuiaVest - Status do sistema</title>
  <link rel="stylesheet" href="src/css/base.css">
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .status-card { width: min(100%, 32rem); padding: 2rem; background: var(--card); border-radius: var(--raio-grande); }
    .status-card h1 { margin-bottom: .5rem; }
    .status-card > p { color: var(--texto-suave); }
    #status-indicator { display: inline-block; width: .7rem; height: .7rem; margin-right: .4rem; border-radius: 50%; background: var(--alerta); }
    #status-indicator[data-state="online"] { background: var(--sucesso); }
    #status-indicator[data-state="offline"] { background: var(--vermelho-escuro); }
    .componentes { display: grid; gap: .75rem; margin: 1.5rem 0; }
    .componente { display: flex; justify-content: space-between; padding: .75rem 1rem; background: var(--subfundo); border-radius: var(--raio); }
    .componente span:last-child { font-weight: 500; }
    .acessar { display: block; padding: .75rem; color: var(--texto); background: var(--azul-primario); border-radius: var(--raio); text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <section class="status-card" aria-labelledby="titulo">
      <h1 id="titulo">GuiaVest</h1>
      <p><span id="status-indicator" data-state="checking" aria-hidden="true"></span><span id="status-message">Verificando o sistema...</span></p>
      <div class="componentes" aria-label="Status dos componentes">
        <div class="componente"><span>Servidor</span><span id="server-status">Verificando...</span></div>
        <div class="componente"><span>Banco de dados</span><span id="database-status">Verificando...</span></div>
      </div>
      <a class="acessar" href="pages/login.html">Acessar a plataforma</a>
    </section>
  </main>
  <script src="src/js/app.js"></script>
</body>
</html>
